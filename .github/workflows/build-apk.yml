name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo-dev cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Force /usr/bin/python3 to Python 3.10
        run: |
          echo "=== Before ==="
          /usr/bin/python3 --version || true
          ls -la /usr/bin/python3* || true

          # ubuntu-22.04 ships with python3.10 — find it
          if [ -f /usr/bin/python3.10 ]; then
            echo "Found system python3.10"
            # CRITICAL: replace the symlink so p4a, pip, and all subprocesses see 3.10
            sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
          else
            echo "python3.10 not found, installing..."
            sudo apt-get install -y python3.10 python3.10-venv python3.10-dev
            sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
          fi

          echo "=== After ==="
          /usr/bin/python3 --version
          python3 --version

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37
          pip install buildozer==1.5.0
          echo "Python: $(python3 --version)"
          echo "python3 location: $(which python3)"
          echo "/usr/bin/python3 version: $(/usr/bin/python3 --version)"

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squadfit-apk
          path: ./bin/*.apk
          retention-days: 30
