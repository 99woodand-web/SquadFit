name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Force system Python to 3.10
        run: |
          PY310=$(which python3)
          echo "Python at: $PY310"
          python3 --version
          # Override system python3 and python
          sudo update-alternatives --install /usr/bin/python3 python3 "$PY310" 100
          sudo update-alternatives --install /usr/bin/python python "$PY310" 100
          sudo update-alternatives --set python3 "$PY310"
          sudo update-alternatives --set python "$PY310"
          # Add to front of PATH
          PY310_DIR=$(dirname "$PY310")
          echo "$PY310_DIR" >> $GITHUB_PATH
          # Verify
          which python3
          python3 --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo-dev cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37
          pip install buildozer==1.5.0

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squadfit-apk
          path: ./bin/*.apk
          retention-days: 30
