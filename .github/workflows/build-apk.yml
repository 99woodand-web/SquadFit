name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo-dev cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Force system Python to 3.10
        run: |
          echo "=== System Python before ==="
          /usr/bin/python3 --version
          # ubuntu-22.04 has python3.10 at /usr/bin/python3.10
          if [ -f /usr/bin/python3.10 ]; then
            sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
            echo "Replaced /usr/bin/python3 with python3.10"
          else
            echo "Installing python3.10..."
            sudo apt-get install -y python3.10 python3.10-dev
            sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
          fi
          echo "=== System Python after ==="
          /usr/bin/python3 --version
          python3 --version

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37
          pip install buildozer==1.5.0

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squadfit-apk
          path: ./bin/*.apk
          retention-days: 30
