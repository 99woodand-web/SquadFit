name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo-dev cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Verify system Python
        run: |
          python3 --version
          which python3

      - name: Install Buildozer and compatibility packages
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          # Cython 3.1.x does NOT use cgi module (removed in Python 3.14)
          pip install cython>=3.0.11
          # legacy-cgi backports the removed cgi module for Python 3.14+
          pip install legacy-cgi
          pip install buildozer==1.5.0

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build APK
        env:
          # Prevent pip from creating isolated build venvs that miss our packages
          PIP_NO_BUILD_ISOLATION: "1"
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squadfit-apk
          path: ./bin/*.apk
          retention-days: 30
